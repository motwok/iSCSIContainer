name: Package update

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  packages:
    name: Record the image packages
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build both images and list their packages
        run: sh tools/packages.sh
      - name: Changed?
        id: diff
        run: |
          git add -N packages
          if git diff --quiet -- packages; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No package changed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- packages
          fi
      - name: Pull request
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "Emmo Emminghaus"
          git config user.email "${{ vars.PACKAGES_EMAIL || 'motwok@users.noreply.github.com' }}"
          git checkout -B chore/image-packages
          git add packages
          git commit -q -m "chore(deps): update image packages"
          git push -f origin chore/image-packages
          gh pr view chore/image-packages --json state --jq .state 2>/dev/null | grep -q OPEN ||
            gh pr create --base master --head chore/image-packages \
              --title "chore(deps): update image packages" --body "Installed package versions changed." \
              --label dependencies
          # Pull request runs of github-actions[bot] wait for approval, and dispatched runs do not
          # count as required checks, so the run is approved here.
          # The merge job (dependabot-automerge.yml) merges it once green.
          sha=$(git rev-parse HEAD)
          ids=
          for _ in $(seq 30); do
            ids=$(gh run list --commit "$sha" --event pull_request --json databaseId,conclusion \
              --jq '.[] | select(.conclusion == "action_required") | .databaseId')
            [ -z "$ids" ] || break
            sleep 10
          done
          [ -n "$ids" ] || { echo "::error::no pull request run waiting for approval"; exit 1; }
          for id in $ids; do
            gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/approve"
          done
